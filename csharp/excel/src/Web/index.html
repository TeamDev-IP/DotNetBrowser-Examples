<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Excel COM Add-in Demo</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            padding: 24px;
            max-width: 480px;
        }

        h1 { font-size: 18px; margin-bottom: 20px; }

        .section { margin-bottom: 20px; }

        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }

        input {
            display: block;
            padding: 7px 10px;
            width: 220px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font: inherit;
            margin-bottom: 8px;
        }

        button {
            display: block;
            padding: 7px 16px;
            border: none;
            border-radius: 4px;
            background: #0078d4;
            color: white;
            cursor: pointer;
            font: inherit;
        }

        button:hover { background: #106ebe; }

        #output {
            margin-top: 20px;
            padding: 12px;
            background: #f4f4f4;
            border-radius: 4px;
            min-height: 40px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Excel COM Add-in Demo</h1>

    <div class="section">
        <label>Read value from Excel cell A1:</label>
        <button id="btn-read">Read from Excel</button>
    </div>

    <div class="section">
        <label>Write a value to Excel cell A1:</label>
        <input id="txt-write" type="text" placeholder="Hello from the browser!" />
        <button id="btn-write">Write to Excel</button>
    </div>

    <div id="output">Press a button to interact with Excel.</div>

    <script>
        (function () {
            var bridge = window.excelBridge;
            var output = document.getElementById('output');

            document.getElementById('btn-read').addEventListener('click', function () {
                output.textContent = `A1: ${bridge.readFromExcel()}`;
            });

            document.getElementById('btn-write').addEventListener('click', function () {
                var value = document.getElementById('txt-write').value || 'Hello from the browser!';
                bridge.writeToExcel(value);
                output.textContent = `Written "${value}" to A1.`;
            });
        })();
    </script>
</body>
</html>
