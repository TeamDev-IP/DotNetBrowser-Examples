<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weekly sales report</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 32px;
           color: #1f2937; background: #ffffff; }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .meta { color: #6b7280; margin-bottom: 24px; }
    table { border-collapse: collapse; margin-bottom: 24px; min-width: 420px; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 6px 12px;
             text-align: left; }
    td.num, th.num { text-align: right; }
    #summary { padding: 12px 16px; background: #eef6ff;
               border-left: 4px solid #2563eb; max-width: 640px; }
    @media print { body { margin: 16px; } }
  </style>
</head>
<body>
  <h1>Weekly sales report</h1>
  <div class="meta" id="meta">Waiting for JavaScript...</div>
  <table id="table">
    <thead>
      <tr><th>Region</th><th class="num">Orders</th><th class="num">Revenue</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <svg id="chart" width="640" height="260" role="img"
       aria-label="Revenue by region"></svg>
  <p id="summary">Summary not generated: JavaScript did not run.</p>

  <script>
    // Everything below the heading is produced by script, so the PDF and
    // PNG only show data if JavaScript ran in the service.
    const rows = [
      { region: "North", orders: 412, revenue: 48200 },
      { region: "South", orders: 288, revenue: 31900 },
      { region: "East", orders: 351, revenue: 40650 },
      { region: "West", orders: 197, revenue: 22400 }
    ];

    document.getElementById("meta").textContent =
      "Generated by JavaScript at " + new Date().toISOString() +
      " | user agent: " + navigator.userAgent;

    const body = document.querySelector("#table tbody");
    for (const row of rows) {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td>" + row.region + "</td>" +
        "<td class='num'>" + row.orders + "</td>" +
        "<td class='num'>$" + row.revenue.toLocaleString("en-US") + "</td>";
      body.appendChild(tr);
    }

    const svg = document.getElementById("chart");
    const ns = "http://www.w3.org/2000/svg";
    const max = Math.max(...rows.map(r => r.revenue));
    rows.forEach((row, i) => {
      const height = Math.round(200 * row.revenue / max);
      const bar = document.createElementNS(ns, "rect");
      bar.setAttribute("x", 40 + i * 140);
      bar.setAttribute("y", 220 - height);
      bar.setAttribute("width", 90);
      bar.setAttribute("height", height);
      bar.setAttribute("fill", "#2563eb");
      svg.appendChild(bar);
      const label = document.createElementNS(ns, "text");
      label.setAttribute("x", 85 + i * 140);
      label.setAttribute("y", 245);
      label.setAttribute("text-anchor", "middle");
      label.textContent = row.region;
      svg.appendChild(label);
    });

    // Filled in later, like data that arrives after the load event.
    setTimeout(() => {
      const total = rows.reduce((sum, r) => sum + r.revenue, 0);
      document.getElementById("summary").textContent =
        "Total revenue: $" + total.toLocaleString("en-US") +
        " from " + rows.length + " regions (filled by setTimeout).";
      document.documentElement.dataset.ready = "true";
    }, 500);
  </script>
</body>
</html>
