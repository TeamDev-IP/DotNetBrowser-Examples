<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Blocked by policy</title><link rel="stylesheet" href="portal.css"></head>
<body>
<main class="blocked">
  <h1>Blocked by policy</h1>
  <p>The assistant may not open this address:</p>
  <p><code id="url"></code></p>
  <p>Only the sites on the application's allowlist are available.</p>
  <script>
    document.getElementById('url').textContent = new URLSearchParams(location.search).get('url') || '';
  </script>
</main>
</body>
</html>
