<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New order — Northwind Supply</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
<header>
  <span class="brand">Northwind Supply</span>
  <a href="catalogue.html">Catalogue</a>
  <a href="order.html">Orders</a>
</header>
<main>
  <h1>New order</h1>
  <form method="post" action="order">
    <label for="part">Part number</label>
    <input id="part" name="part" type="text">
    <label for="quantity">Quantity</label>
    <input id="quantity" name="quantity" type="text">
    <label for="warehouse">Deliver to</label>
    <input id="warehouse" name="warehouse" type="text">
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="2"></textarea>
    <button type="submit">Place order</button>
  </form>
  <script>
    const part = new URLSearchParams(location.search).get('part');
    if (part) document.getElementById('part').value = part;
  </script>
</main>
</body>
</html>
